<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TransmiFlow - Acceso Operador</title>
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/lucide.js"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: {
      red: '#ef4444', darkRed: '#b91c1c', dark: '#030712', card: '#0b0f19', border: '#1f293d'
    } } } } };
  </script>
  <style>body{background:#030712;overflow-x:hidden}.glass-panel{background:rgba(11,15,25,.85);backdrop-filter:blur(12px)}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10 text-white">
  <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-brand-border w-full max-w-md shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3.5 bg-brand-red/10 border border-brand-red/30 rounded-2xl text-brand-red">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black">Acceso Operador</h1>
      <p class="text-xs text-slate-400">Gesti&oacute;n del sistema de transporte</p>
    </div>

    <div id="msg" class="hidden p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl text-center font-medium"></div>

    <form id="formOp" class="space-y-4">
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Correo Electronico</label>
        <input type="email" id="email" required placeholder="operador@correo.com"
          class="w-full px-4 py-3 bg-brand-dark border border-brand-border rounded-xl text-white focus:outline-none focus:border-brand-red text-sm">
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Contrasena</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="********"
            class="w-full pl-4 pr-12 py-3 bg-brand-dark border border-brand-border rounded-xl text-white focus:outline-none focus:border-brand-red text-sm">
          <button type="button" onclick="toggleCampo('password', this)" title="Mostrar contraseña" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-white"><i data-lucide="eye" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Codigo de autenticacion</label>
        <div class="relative">
          <input type="password" id="codigo" required placeholder="Codigo de acceso"
            class="w-full pl-4 pr-12 py-3 bg-brand-dark border border-brand-border rounded-xl text-white focus:outline-none focus:border-brand-red text-sm">
          <button type="button" onclick="toggleCampo('codigo', this)" title="Mostrar codigo" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-white"><i data-lucide="eye" class="w-4 h-4"></i></button>
        </div>
      </div>
      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-brand-red to-brand-darkRed text-white font-bold rounded-xl text-sm">
        Ingresar al Panel Operativo
      </button>
    </form>

    <div class="text-center">
      <a href="/" class="text-[10px] font-semibold text-slate-400 hover:text-brand-red hover:underline">
        Volver al ingreso de usuarios
      </a>
    </div>
  </div>

  <script>
    function toggleCampo(id, boton) {
      var input = document.getElementById(id);
      if (!input) { return; }
      var mostrar = input.type === 'password';
      input.type = mostrar ? 'text' : 'password';
      var icono = boton ? (boton.querySelector('[data-lucide]') || boton.querySelector('i')) : null;
      if (icono) {
        icono.setAttribute('data-lucide', mostrar ? 'eye-off' : 'eye');
        lucide.createIcons();
      }
      if (boton) { boton.title = mostrar ? 'Ocultar' : 'Mostrar'; }
    }
  
    lucide.createIcons();
    document.getElementById('formOp').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      msg.classList.add('hidden');
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          codigo: document.getElementById('codigo').value.trim()
        })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok || !res.d.usuario || res.d.usuario.rol !== 'operario') {
            msg.textContent = (res.d && res.d.error) || 'Credenciales de operador incorrectas.';
            msg.classList.remove('hidden');
            return;
          }
          localStorage.setItem('usuarioTransmiFlowReal', JSON.stringify(res.d.usuario));
          localStorage.setItem('transmiFlowToken', res.d.token || '');
          location.href = '/';
        })
        .catch(function () {
          msg.textContent = 'No se pudo conectar con el servidor.';
          msg.classList.remove('hidden');
        });
    });
  </script>
</body>
</html>
